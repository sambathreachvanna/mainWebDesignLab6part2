<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            flex-direction: column;
            
        }
        header,footer{
            background-color: darkgrey;
            text-align: center;
            justify-content: center;
            min-height: clamp(40px,10vw,80px);
        }
        .content{
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        .mainContent{
            background-color: bisque;
            flex: 1;
            padding: 16px 10px;
        }
        .sidebar{
            background-color: cornsilk;
            flex: 1;
            padding: 16px 10px;
        }
        @media (min-width: 600px) {

            .content{
                flex-direction: row;
                gap: 10px;
            }
        }
        @media (min-width: 900px) {
            .mainContent{
                flex: 2;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <p>Responsive Header</p>
        </header>
        <div class="content">
            <p class="mainContent">Main Content</p>
            <p class="sidebar">Sidebar</p>
        </div>
        <footer>
            <p>Footer</p>
        </footer>
    </div>

</body>
</html>
