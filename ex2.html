<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .navigation-bar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: beige;
            padding: 1.25em;
            position: relative;
        }
        nav{

            display: flex;
            flex-direction: row;
            gap: 1em;
        }

        @media (max-width: 768px) {
            nav{
                flex-direction: column;
                position: absolute;
                top: 0;
                right: 0;
                width: 180px;
                background-color: burlywood;
                padding: 14px 20px;
                box-sizing: border-box;
                gap: 12px;
                height: 100vh;
            }
            
        }
    </style>
</head>
<body>
    
    <div class="navigation-bar">

        <h1>logo</h1>
        
        <nav>
            <h3>Home</h3>
            <h3>About</h3>
            <h3>Services</h3>
            <h3>Contact</h3>
        </nav>
    </div>
</body>
</html>
